{% extends "base.html" %}

{% block title %}Skills{% endblock %}

{% block content %}

<section class="container skills-page">

    <header class="page-header">
        <h2>Skills Developed</h2>
        <p>
            The following skills were developed during the Full Stack Software Development course.
        </p>
    </header>

    <!-- DYNAMIC SKILLS GRID -->
    <section class="skills-grid">

        {% for skill in skills %}
        <article class="skill-card">
            <h3>{{ skill.name }}</h3>
            <p>{{ skill.desc }}</p>
        </article>
        {% endfor %}

    </section>

    <!-- IMAGE -->
    <section class="skills-image">
        <img src="{{ url_for('static', filename='images/education.jpg') }}"
             alt="Illustration representing learning and skill development">
    </section>

</section>

{% endblock %}
