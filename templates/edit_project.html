{% extends "base.html" %}

{% block title %}Edit Project{% endblock %}

{% block content %}

<section class="container">

    <h2>Edit Project</h2>

    <!-- FORM CARD -->
    <div class="contact-card">

 <form method="POST">

    <!-- TITLE -->
    <div class="form-group">
        <label for="title">Project Title</label>
        <input 
            type="text" 
            id="title" 
            name="title" 
            value="{{ project.title }}" 
            required>
    </div>

    <!-- DESCRIPTION -->
    <div class="form-group">
        <label for="description">Description</label>
        <textarea 
            name="description" 
            id="description" 
            rows="4" 
            required>{{ project.description }}</textarea>
    </div>

    <!-- SUBMIT -->
    <button type="submit" class="btn">Update Project</button>

</form>

    </div>

    <!-- BACK LINK -->
    <div class="back-link">
        <a href="{{ url_for('projects_page') }}" class="btn">← Back to Projects</a>
    </div>

</section>

{% endblock %}
