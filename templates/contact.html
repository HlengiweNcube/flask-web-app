<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">
        <div class="container nav-flex">
            <h1 class="logo">My Portfolio</h1>

            <nav aria-label="Main navigation">
                <a href="{{ url_for('home') }}"
                   class="{% if request.path == url_for('home') %}active{% endif %}">Home</a>

                <a href="{{ url_for('about_page') }}"
                   class="{% if request.path == url_for('about_page') %}active{% endif %}">About</a>

                <a href="{{ url_for('skills_page') }}"
                   class="{% if request.path == url_for('skills_page') %}active{% endif %}">Skills</a>

                <a href="{{ url_for('projects_page') }}"
                   class="{% if request.path == url_for('projects_page') %}active{% endif %}">Projects</a>

                <a href="{{ url_for('contact') }}"
                   class="{% if request.path == url_for('contact') %}active{% endif %}">Contact</a>
            </nav>
        </div>
    </header>

    <!-- HERO -->
    <section class="contact-hero">
        <div class="container">
            <p>Send a message or get in touch about my projects.</p>
        </div>
    </section>

    <!-- MAIN -->
    <main class="container">

        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul class="flash-container">
            {% for msg in messages %}
            <li>{{ msg }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}

        <!-- FORM -->
        <div class="contact-card">
            <form method="POST">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" name="name" id="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" name="phone" id="phone" required pattern="[0-9]+">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn">Send Message</button>

            </form>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <p>© 2026 Flask Portfolio</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        document.querySelector("form").addEventListener("submit", function (e) {
            const name = document.getElementById("name").value;

            if (name.length < 2) {
                alert("Name must be at least 2 characters long");
                e.preventDefault();
            }
        });
    </script>

</body>
</html>
